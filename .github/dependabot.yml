version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      aiogram:
        patterns: ["aiogram"]
      sqlalchemy:
        patterns: ["sqlalchemy", "asyncpg", "alembic"]
      pydantic:
        patterns: ["pydantic*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
